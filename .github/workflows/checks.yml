name: checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Навигация и ссылки
        run: bash scripts/check-links.sh

      - name: Опечатки и посторонние символы
        run: python scripts/check-text.py

      - name: Синтаксис примеров кода
        run: python scripts/check-examples.py
